name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # The factory runs this job's `run:` steps inside its Docker sandbox, so nothing here may need Docker.
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked --lib --bins
      # The black-box suite starts the binary directly and talks only to its two ports.
      - run: cargo test --locked --test blackbox
      # The deployment files: compose, connector.toml and the Caddyfile.
      - run: cargo test --locked --test deploy_guard

  image:
    runs-on: ubuntu-latest
    needs: gate
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t blossom:ci .
      - name: Start the container
        run: |
          docker run -d --name blossom -p 3000:3000 -p 3001:3001 \
            -e TOON_BLOB_PUBLIC_URL=http://blobs.test blossom:ci
          for _ in $(seq 30); do
            curl -s -o /dev/null http://127.0.0.1:3000/0 && exit 0
            sleep 1
          done
          echo "the container's public port never answered" >&2
          exit 1
      - name: Black-box suite against the container
        env:
          BLOSSOM_TEST_WRITE_URL: http://127.0.0.1:3001
          BLOSSOM_TEST_PUBLIC_URL: http://127.0.0.1:3000
        run: cargo test --locked --test blackbox
      - if: failure()
        run: docker logs blossom
