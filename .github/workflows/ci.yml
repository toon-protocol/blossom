name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # The factory runs this job's `run:` steps inside its Docker sandbox, so nothing here may need Docker.
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked --lib --bins
      # The black-box suite starts the binary directly and talks only to its two ports.
      - run: cargo test --locked --test blackbox
      # The bundle files: compose, connector.toml and the Caddyfile.
      - run: cargo test --locked --test deploy_guard

  # The image is built once and both suites run against that same image, which `publish` then pushes.
  image:
    runs-on: ubuntu-latest
    needs: gate
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t blossom:ci .
      - run: docker save blossom:ci -o blossom-image.tar
      - uses: actions/upload-artifact@v4
        with:
          name: blossom-image
          path: blossom-image.tar
          retention-days: 1
      - name: Start the container
        run: |
          docker run -d --name blossom -p 3000:3000 -p 3001:3001 \
            -e TOON_BLOB_PUBLIC_URL=http://blobs.test \
            -e TOON_BLOB_STORAGE_CAP_BYTES=1000000000 blossom:ci
          for _ in $(seq 30); do
            curl -s -o /dev/null http://127.0.0.1:3000/0 && exit 0
            sleep 1
          done
          echo "the container's public port never answered" >&2
          exit 1
      - name: Black-box suite against the container
        env:
          BLOSSOM_TEST_WRITE_URL: http://127.0.0.1:3001
          BLOSSOM_TEST_PUBLIC_URL: http://127.0.0.1:3000
        run: cargo test --locked --test blackbox
      - if: failure()
        run: docker logs blossom

  # blossom-compliance against the built image, through a test-only proxy that joins the two ports
  # and states a payment on the paid paths. The suite always exits 0, so tests/compliance/check.mjs
  # fails the build from its results.json. Markers for surfaces not built yet are in
  # tests/compliance/expected-failures.json: each later ticket removes its own.
  compliance:
    runs-on: ubuntu-latest
    needs: image
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - uses: actions/download-artifact@v4
        with:
          name: blossom-image
      - run: docker load -i blossom-image.tar
      - run: BLOSSOM_IMAGE=blossom:ci tests/compliance/run.sh

  # Only a push to main, after both suites are green, publishes. Pull requests never reach this job.
  # Publishes run one at a time, and `:release` only moves to the commit that is still main's head,
  # so a slow run for an older merge never moves it back.
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [gate, image, compliance]
    concurrency:
      group: publish
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: blossom-image
      - run: docker load -i blossom-image.tar
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tags=("sha-$GITHUB_SHA")
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [[ $head == "$GITHUB_SHA" ]]; then
            tags+=(release)
          else
            echo "main has moved on to $head, so :release stays where it is" >&2
          fi
          for tag in "${tags[@]}"; do
            docker tag blossom:ci "ghcr.io/toon-protocol/blossom:$tag"
            docker push "ghcr.io/toon-protocol/blossom:$tag"
          done
