[package]
name = "blossom"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "The TOON Protocol blob app: a Blossom server behind connector routes"
rust-version = "1.98"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"

[dependencies]
axum = "0.8"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
http-body-util = "0.1"
httpdate = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
mime_guess = "2"
# The relay's pin: Nostr events and their id and signature checks come from this crate alone.
nostr = { version = "=0.45.4", default-features = false, features = ["std"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "fs"] }

tower-http = { version = "0.6", features = ["cors"] }

[dev-dependencies]
# Tests sign events by hand, as an independent client would, so they never share the app's checks.
k256 = { version = "0.13", features = ["schnorr"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }
serde_yaml_ng = "0.10"
toml = "1"
trybuild = "1"
